name: Upgrade Verification

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check dependencies
        run: composer update --dry-run

  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress || true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build JavaScript
        run: npm run build

      - name: Build SCSS
        run: npm run build:scss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-assets
          path: resources/dist/
          retention-days: 1

  integration-laravel9:
    name: Laravel 9.x - PHP 8.0
    runs-on: ubuntu-latest
    needs: [validate, phpstan, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          path: dcat-admin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Create Laravel project
        run: composer create-project --prefer-dist laravel/laravel test-app "9.*"

      - name: Configure and install
        run: |
          cd test-app
          composer config repositories.local path ../dcat-admin
          composer require "dcat/laravel-admin:*@dev" --no-interaction
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          touch database/database.sqlite
          php artisan admin:publish --force
          php artisan migrate --force
          php artisan admin:install --force || true

      - name: Verify installation
        run: |
          cd test-app
          test -d app/Admin && echo "Admin directory exists"
          test -f config/admin.php && echo "Config file exists"

